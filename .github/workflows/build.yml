name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_READY: ${{ secrets.WORKOUT_KEYSTORE_BASE64 != '' && secrets.WORKOUT_SIGNING_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare anatomical exercise images
        if: ${{ hashFiles('assets/workout-exercises.jpg') != '' }}
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          image=Image.open("assets/workout-exercises.jpg").convert("RGB")
          width,height=image.size
          output=Path("app/src/main/res/drawable-nodpi")
          output.mkdir(parents=True,exist_ok=True)
          for i in range(9):
              col,row=i%3,i//3
              left=round(col*width/3)+3
              top=round(row*height/3)+3
              right=round((col+1)*width/3)-3
              bottom=round((row+1)*height/3)-3
              image.crop((left,top,right,bottom)).save(output/f"exercise_pose_{i}.png",optimize=True)
              Path(f"app/src/main/res/drawable/exercise_pose_{i}.xml").unlink(missing_ok=True)
          PY
      - name: Build test APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: workout-widget-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Restore private signing key
        if: env.SIGNING_READY == 'true'
        env:
          KEY_B64: ${{ secrets.WORKOUT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/workout-release.p12"
          chmod 600 "$RUNNER_TEMP/workout-release.p12"
      - name: Build signed update APK
        if: env.SIGNING_READY == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/workout-release.p12
          SIGNING_PASSWORD: ${{ secrets.WORKOUT_SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Publish signed APK update
        if: env.SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" app/build/outputs/apk/release/app-release.apk --title "Workout Widget v1.0.${GITHUB_RUN_NUMBER}" --notes "Signed Android app update" --latest
